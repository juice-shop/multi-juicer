on: [push, pull_request]
name: "Tests"
permissions:
  contents: read
jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache-dependency-path: "go.sum"
      - name: "Place index.html file into ui build folder"
        run: |
          mkdir -p ui/build/
          cp ui/index.html ui/build/index.html
      - name: "Ensure go code is properly formatted"
        run: |
          unformatted=$(go fmt ./...)
          if [ -n "$unformatted" ]; then
            echo "::error::The following files are not properly formatted: $unformatted"
            echo "Run 'go fmt ./...' to fix."
            exit 1
          fi
      - name: "Ensure go code is properly modernized / fixed"
        run: |
          go fix ./...
          if ! git diff --exit-code; then
            echo "::error::go fix produced changes. Run 'go fix ./...' to fix."
            exit 1
          fi
      - name: "Lint"
        run: go vet ./...
      - name: "Staticcheck"
        run: go tool staticcheck ./...
      - name: "go-critic"
        run: go tool gocritic check ./...
      - name: "Test"
        run: go test -cover ./...

  ui:
    name: UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"
      - name: "Install dependencies"
        run: npm ci --ignore-scripts
      - name: "Lint"
        run: npm run lint
      - name: "Test"
        run: npm run test -- --run

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "Run Semgrep"
        run: semgrep scan --config=auto

  helm:
    name: Helm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: helm/multi-juicer/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify tools
        run: |
          helm version
      - name: Install Helm Unit Test Plugin
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest.git --version 1.0.3
      - name: Helm-Chart Unit Tests
        run: helm unittest .

  e2e:
    name: E2E Kubernetes ${{ matrix.kubernetes }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Images published with kind v0.33.0.
          - kubernetes: "1.34.11"
            node-image: kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d
          - kubernetes: "1.35.8"
            node-image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
          - kubernetes: "1.36.4"
            node-image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
          - kubernetes: "1.37.0"
            node-image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    env:
      KIND_NODE_IMAGE: ${{ matrix.node-image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache-dependency-path: "go.sum"
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: "v4.3.0"
      - name: Install Kubernetes test tools
        env:
          KUBERNETES_VERSION: ${{ matrix.kubernetes }}
        run: |
          mkdir -p "$RUNNER_TEMP/e2e-bin"
          cd "$RUNNER_TEMP/e2e-bin"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64 \
            --output kind
          echo "aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  kind" | sha256sum --check
          curl --fail --silent --show-error --location --retry 3 \
            "https://dl.k8s.io/release/v${KUBERNETES_VERSION}/bin/linux/amd64/kubectl" \
            --output kubectl
          curl --fail --silent --show-error --location --retry 3 \
            "https://dl.k8s.io/release/v${KUBERNETES_VERSION}/bin/linux/amd64/kubectl.sha256" \
            --output kubectl.sha256
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/mikefarah/yq/releases/download/v4.53.6/yq_linux_amd64 \
            --output yq
          echo "c5f056448f973ae7d39b5401949648a78f2dc1947d6a8eb65be60d5c504b9385  yq" | sha256sum --check
          chmod +x kind kubectl yq
          echo "$RUNNER_TEMP/e2e-bin" >> "$GITHUB_PATH"
      - name: Check E2E Go code
        run: |
          test -z "$(gofmt -l e2e/*.go)"
          go vet -tags=e2e ./e2e
      - name: Run Kubernetes E2E tests
        env:
          E2E_ARTIFACT_DIR: ${{ runner.temp }}/e2e-artifacts
        run: bash e2e/run.sh
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-kubernetes-${{ matrix.kubernetes }}
          path: ${{ runner.temp }}/e2e-artifacts
          retention-days: 7
